# netlify.toml (プロジェクトルートに配置)

[build]
  base = "aistm-frontend"
  command = "npm --prefix aistm-frontend run build"
  publish = "aistm-frontend/build"

# Next.jsプラグインの使用
[[plugins]]
  package = "@netlify/plugin-nextjs"

# 環境変数（ここでは設定例として記載、実際はNetlifyダッシュボードで設定）
[build.environment]
  NODE_VERSION = "18"

# リダイレクト設定（必要に応じて）
[[redirects]]
  from = "/api/*"
  to = "https://your-backend.up.railway.app/api/:splat"
  status = 200
  force = true

# ヘッダー設定
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"