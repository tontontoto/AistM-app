# aistm-project/docker-compose.yml

services:
  # --- 1. バックエンドサービス (Laravel/PHP-FPM) ---
  backend:
    build:
      context: ./aistm-backend
      dockerfile: Dockerfile
    container_name: aistm-backend_fpm
    volumes:
      - ./aistm-backend:/var/www/html
    environment:
      # LaravelのDB接続設定
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
    depends_on:
      - db
      
  # --- 2. Nginx サービス (Webサーバー) ---
  nginx:
    image: nginx:stable-alpine
    container_name: aistm-backend_nginx
    ports:
      - "8080:80" # ホストの8080ポートをコンテナの80ポートにマッピング
    volumes:
      - ./aistm-backend:/var/www/html # Laravelプロジェクトをマウント
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf # Nginx設定ファイルをマウント
    depends_on:
      - backend # backend (PHP-FPM)が起動してからNginxを起動

  # --- 3. フロントエンドサービス (Next.js) ---
  frontend:
    build:
      context: ./aistm-frontend
      dockerfile: Dockerfile
    container_name: aistm-frontend
    ports:
      - "3000:3000"
    volumes:
      - ./aistm-frontend:/app
      - /app/node_modules
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080/api/ # Laravel APIへのパスを想定

  # --- 4. データベースサービス (MySQL) ---
  db:
    image: mysql:8.0
    container_name: aistm-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    
volumes:
  db_data: