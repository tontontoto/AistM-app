services:
  # --- 1. バックエンドサービス (Laravel/PHP-FPM) ---
  backend:
    build:
      context: ./aistm-backend
      dockerfile: Dockerfile
    container_name: aistm-backend_fpm
    volumes:
      - ./aistm-backend:/var/www/html
    environment:
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: aistm_db
      DB_USERNAME: aistm_user
      DB_PASSWORD: aistm_password
    depends_on:
      - db
      
  # --- 2. Nginx サービス (Webサーバー) ---
  nginx:
    image: nginx:stable-alpine
    container_name: aistm-backend_nginx
    ports:
      - "8080:80"
    volumes:
      - ./aistm-backend:/var/www/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend

  # --- 3. フロントエンドサービス (Next.js) ---
  frontend:
    build:
      context: ./aistm-frontend
      dockerfile: Dockerfile
    container_name: aistm-frontend
    ports:
      - "3000:3000"
    volumes:
      - ./aistm-frontend:/app
      - /app/node_modules
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080/api/

  # --- 4. データベースサービス (MySQL) ---
  db:
    image: mysql:8.0
    container_name: aistm-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: aistm_db
      MYSQL_USER: aistm_user
      MYSQL_PASSWORD: aistm_password
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  # --- 5. phpMyAdmin サービス ---
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: aistm-phpmyadmin
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      PMA_USER: aistm_user
      PMA_PASSWORD: aistm_password
      PMA_ROOT_PASSWORD: root_password
    depends_on:
      - db
    
volumes:
  db_data: